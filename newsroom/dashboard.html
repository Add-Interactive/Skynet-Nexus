<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review Console — Skynet Nexus Newsroom</title>
<style>
  :root {
    --bg: #0b0e14; --panel: #131822; --panel2: #1a2130; --line: #2a3348;
    --ink: #e8edf5; --muted: #8b94a7; --accent: #00e5ff; --gold: #ffb800;
    --green: #39ff14; --red: #ff2e63; --amber: #ffaa00;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--ink); font-family: -apple-system, "Segoe UI", Inter, Roboto, sans-serif; line-height: 1.5; }
  .app { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }

  /* Sidebar */
  .side { background: var(--panel); border-right: 1px solid var(--line); padding: 20px 14px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  .brand { font-weight: 800; letter-spacing: 0.08em; font-size: 14px; margin-bottom: 2px; }
  .brand span { color: var(--accent); }
  .sub { color: var(--muted); font-size: 11px; margin-bottom: 20px; }
  .nav-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); margin: 16px 6px 6px; }
  .nav-btn { display: flex; justify-content: space-between; align-items: center; width: 100%; text-align: left;
    background: none; border: 1px solid transparent; color: var(--ink); padding: 9px 10px; border-radius: 8px;
    font-size: 13px; cursor: pointer; }
  .nav-btn:hover { background: var(--panel2); }
  .nav-btn.active { background: var(--panel2); border-color: var(--line); }
  .nav-btn .count { background: var(--line); border-radius: 10px; padding: 1px 8px; font-size: 11px; color: var(--muted); }
  .nav-btn.active .count { color: var(--ink); }

  /* Main */
  .main { padding: 22px 28px; max-width: 1100px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; flex-wrap: wrap; gap: 10px; }
  .topbar h1 { font-size: 20px; font-weight: 700; }
  .drop-pill { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; font-size: 13px; }
  .drop-pill b { color: var(--gold); }
  .drop-pill .t { font-variant-numeric: tabular-nums; font-weight: 700; }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 12px; overflow: hidden; }
  .card-head { padding: 14px 16px; cursor: pointer; display: flex; gap: 12px; align-items: flex-start; }
  .card-head:hover { background: var(--panel2); }
  .chan { flex: none; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em;
    background: var(--line); border-radius: 6px; padding: 3px 8px; margin-top: 2px; }
  .card-title { font-size: 15px; font-weight: 600; }
  .card-meta { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .card-excerpt { font-size: 13px; color: var(--muted); margin-top: 6px; }
  .status-dot { flex: none; margin-left: auto; font-size: 11px; font-weight: 700; text-transform: uppercase; padding: 3px 10px; border-radius: 10px; }
  .st-draft { background: rgba(255,170,0,.15); color: var(--amber); }
  .st-approved { background: rgba(57,255,20,.12); color: var(--green); }
  .st-rejected { background: rgba(255,46,99,.15); color: var(--red); }
  .st-scheduled { background: rgba(0,229,255,.12); color: var(--accent); }
  .st-published { background: rgba(139,148,167,.15); color: var(--muted); }

  .card-body { display: none; border-top: 1px solid var(--line); padding: 16px; }
  .card.open .card-body { display: block; }
  .art-body { font-size: 14px; }
  .art-body p { margin-bottom: 10px; }
  .art-body h2 { font-size: 16px; margin: 14px 0 8px; }
  .art-body blockquote { border-left: 3px solid var(--accent); padding-left: 12px; color: var(--muted); margin: 10px 0; }
  .sec-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); margin: 16px 0 6px; }
  .kidtake { background: var(--panel2); border-radius: 8px; padding: 12px; font-size: 13px; }
  .discuss { margin: 6px 0 6px 18px; font-size: 13px; }
  .gloss { font-size: 13px; margin: 4px 0; }
  .gloss b { color: var(--accent); }
  .sources { font-size: 12px; }
  .sources a { color: var(--accent); }

  .actions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  .btn { border: 1px solid var(--line); background: var(--panel2); color: var(--ink); border-radius: 8px;
    padding: 8px 16px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .btn:hover { border-color: var(--muted); }
  .btn.approve { border-color: var(--green); color: var(--green); }
  .btn.spike { border-color: var(--red); color: var(--red); }
  .btn.publish { border-color: var(--gold); color: var(--gold); }
  .btn:disabled { opacity: .5; cursor: default; }

  .notes { margin-top: 14px; }
  .notes textarea { width: 100%; min-height: 70px; background: var(--bg); border: 1px solid var(--line);
    border-radius: 8px; color: var(--ink); padding: 10px; font-size: 13px; font-family: inherit; resize: vertical; }
  .note-saved { font-size: 12px; color: var(--muted); margin-top: 6px; font-style: italic; }

  .empty { text-align: center; color: var(--muted); padding: 60px 20px; font-size: 14px; }
  .toast { position: fixed; bottom: 20px; right: 20px; background: var(--panel2); border: 1px solid var(--line);
    border-radius: 10px; padding: 12px 18px; font-size: 13px; display: none; z-index: 100; }
  .crew-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .crew-card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .crew-card .emoji { font-size: 28px; }
  .crew-card .name { font-weight: 700; margin-top: 6px; }
  .crew-card .role { font-size: 12px; color: var(--muted); }
  @media (max-width: 760px) { .app { grid-template-columns: 1fr; } .side { height: auto; position: static; } }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">SKYNET <span>NEXUS</span></div>
    <div class="sub">Newsroom · Review Console</div>
    <div class="nav-label">Editions</div>
    <button class="nav-btn active" data-view="morning">🌅 Morning <span class="count" id="c-morning">0</span></button>
    <button class="nav-btn" data-view="midday">☀️ Midday <span class="count" id="c-midday">0</span></button>
    <button class="nav-btn" data-view="evening">🌙 Evening <span class="count" id="c-evening">0</span></button>
    <div class="nav-label">Queue</div>
    <button class="nav-btn" data-view="all">📥 All drafts <span class="count" id="c-all">0</span></button>
    <button class="nav-btn" data-view="scheduled">⏰ Scheduled <span class="count" id="c-scheduled">0</span></button>
    <button class="nav-btn" data-view="published">📰 Published <span class="count" id="c-published">0</span></button>
    <div class="nav-label">Newsroom</div>
    <button class="nav-btn" data-view="crew">🎙️ Correspondents</button>
  </aside>
  <main class="main">
    <div class="topbar">
      <h1 id="view-title">Morning edition</h1>
      <div class="drop-pill" id="drop-pill">Next drop: <b>—</b> · <span class="t">—</span></div>
    </div>
    <div id="content"></div>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
// Same-origin when served by the app; production fallback when opened as a file.
const ADMIN_API = (location.protocol.startsWith('http') && !location.protocol.startsWith('file'))
  ? location.origin + '/api/admin'
  : 'https://skynet-nexus-production.up.railway.app/api/admin';

let view = 'morning';
let drafts = [], scheduled = [], published = [], staff = [];
let scheduleInfo = null;

async function api(path, opts = {}) {
  const resp = await fetch(ADMIN_API + path, Object.assign({
    headers: { 'Content-Type': 'application/json' }
  }, opts));
  if (!resp.ok) {
    const t = await resp.text().catch(() => '');
    throw new Error('HTTP ' + resp.status + ' ' + t.slice(0, 120));
  }
  return resp.json();
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 2600);
}

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function dropCountdown() {
  if (!scheduleInfo || !scheduleInfo.nextDrop) return;
  const ms = new Date(scheduleInfo.nextDrop.at) - Date.now();
  const el = document.getElementById('drop-pill');
  if (ms <= 0) { el.innerHTML = 'Next drop: <b>releasing…</b>'; return; }
  const h = Math.floor(ms / 3600000), m = Math.floor(ms % 3600000 / 60000), s2 = Math.floor(ms % 60000 / 1000);
  const ed = scheduleInfo.nextDrop.edition;
  el.innerHTML = 'Next drop: <b>' + esc(ed) + '</b> · <span class="t">' +
    String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':' + String(s2).padStart(2,'0') + '</span>';
}

function editionOf(story) {
  if (story.edition) return story.edition;
  if (story.scheduledAt) {
    const h = new Date(story.scheduledAt).getUTCHours() - 4; // approx ET
    if (h === 10) return 'morning'; if (h === 14) return 'midday'; if (h === 18) return 'evening';
  }
  return 'unscheduled';
}

function storyCard(s) {
  const p = s.payload || {};
  const ed = editionOf(s);
  const dropNote = s.scheduledAt
    ? ' · drop ' + new Date(s.scheduledAt).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' })
    : '';
  const autoNote = (s.status === 'draft' && s.scheduledAt)
    ? ' · <span style="color:var(--amber)">auto-publishes at drop if unreviewed</span>' : '';
  return `
  <div class="card" id="card-${s.id}">
    <div class="card-head" onclick="document.getElementById('card-${s.id}').classList.toggle('open')">
      <span class="chan">${esc(s.channel)}</span>
      <div>
        <div class="card-title">${esc(p.title || 'Untitled')}</div>
        <div class="card-meta">${esc(p.author || '')} · ${esc(p.ageBand || '')} · ${ed}${dropNote}</div>
        <div class="card-excerpt">${esc(p.excerpt || '')}</div>
      </div>
      <span class="status-dot st-${s.status}">${esc(s.status)}</span>
    </div>
    <div class="card-body">
      <div class="art-body">${p.body || ''}</div>
      <div class="sec-label">Kid take</div>
      <div class="kidtake">${esc(p.kidTake || '')}</div>
      <div class="sec-label">Family discussion</div>
      <ul class="discuss">${(p.familyDiscussion || []).map(q => '<li>' + esc(q) + '</li>').join('')}</ul>
      ${(p.glossary && p.glossary.length) ? '<div class="sec-label">Glossary</div>' + p.glossary.map(g => '<div class="gloss"><b>' + esc(g.term) + '</b> — ' + esc(g.meaning) + '</div>').join('') : ''}
      ${(p.sources && p.sources.length) ? '<div class="sec-label">Sources</div><div class="sources">' + p.sources.map(x => '<div><a href="' + esc(x.url) + '" target="_blank" rel="noopener">' + esc(x.label || x.url) + '</a></div>').join('') + '</div>' : ''}
      <div class="sec-label">Director notes (seen by the newsroom on the final pass)</div>
      <div class="notes">
        <textarea id="notes-${s.id}" placeholder="Leave feedback for the correspondent…">${esc(s.editorNotes || '')}</textarea>
        <div style="margin-top:8px"><button class="btn" onclick="saveNote(${s.id})">💾 Save note</button></div>
        <div class="note-saved">${s.editorNotes ? 'Note saved. It will be applied on the final pre-drop pass.' : ''}${autoNote}</div>
      </div>
      <div class="actions">
        <button class="btn approve" onclick="setStatus(${s.id}, 'approved')">✓ Approve</button>
        <button class="btn spike" onclick="setStatus(${s.id}, 'rejected')">✕ Spike</button>
        <button class="btn publish" onclick="publishNow(${s.id})">🚀 Publish now</button>
        <button class="btn" onclick="scheduleNext(${s.id})">⏰ Schedule for next drop</button>
      </div>
    </div>
  </div>`;
}

async function setStatus(id, status) {
  if (status === 'rejected' && !confirm('Spike this story? It will never auto-publish.')) return;
  await api('/stories/queue/' + id, { method: 'PATCH', body: JSON.stringify({ status }) });
  toast(status === 'approved' ? 'Approved ✓' : 'Spiked ✕');
  refresh();
}

async function saveNote(id) {
  const v = document.getElementById('notes-' + id).value;
  await api('/stories/queue/' + id, { method: 'PATCH', body: JSON.stringify({ editorNotes: v }) });
  toast('Note saved 💾');
  refresh(false);
}

async function publishNow(id) {
  if (!confirm('Publish this story immediately?')) return;
  await api('/stories/queue/' + id + '/publish', { method: 'POST' });
  toast('Published 🚀');
  refresh();
}

async function scheduleNext(id) {
  await api('/stories/queue/' + id + '/schedule', { method: 'POST', body: JSON.stringify({}) });
  toast('Scheduled ⏰');
  refresh();
}

function render() {
  const c = document.getElementById('content');
  const t = document.getElementById('view-title');
  const byEdition = ed => drafts.filter(s => editionOf(s) === ed);
  const counts = {
    morning: byEdition('morning').length,
    midday: byEdition('midday').length,
    evening: byEdition('evening').length,
    all: drafts.length, scheduled: scheduled.length, published: published.length
  };
  for (const k in counts) { const el = document.getElementById('c-' + k); if (el) el.textContent = counts[k]; }

  if (view === 'crew') {
    t.textContent = 'Correspondents';
    c.innerHTML = '<div class="crew-grid">' + staff.filter(s => s.kind === 'agent' && s.status === 'active').map(s => `
      <div class="crew-card">
        <div class="emoji">${s.avatarEmoji || '🎙️'}</div>
        <div class="name">${esc(s.displayName)}</div>
        <div class="role">${esc(s.role || '')}</div>
        <div class="role" style="margin-top:6px">${esc(s.bio || '')}</div>
      </div>`).join('') + '</div>';
    return;
  }
  let list, title;
  if (view === 'scheduled') { list = scheduled; title = 'Scheduled stories'; }
  else if (view === 'published') { list = published.slice(0, 40); title = 'Recently published'; }
  else if (view === 'all') { list = drafts; title = 'All drafts'; }
  else { list = byEdition(view); title = view[0].toUpperCase() + view.slice(1) + ' edition'; }
  t.textContent = title;
  c.innerHTML = list.length ? list.map(storyCard).join('')
    : '<div class="empty">Nothing here yet. Correspondents file 1 hour before each drop.</div>';
}

async function refresh(rerender = true) {
  try {
    const [q, sch, pub, st] = await Promise.all([
      api('/stories/queue?status=draft&limit=100'),
      api('/stories/scheduled'),
      api('/stories/queue?status=published&limit=40'),
      api('/staff')
    ]);
    drafts = q.stories || [];
    scheduled = sch.stories || [];
    scheduleInfo = sch.schedule || null;
    published = pub.stories || [];
    staff = st.staff || [];
    if (rerender) render();
    dropCountdown();
  } catch (e) { console.error(e); }
}

document.querySelectorAll('.nav-btn').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.nav-btn').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  view = b.dataset.view;
  render();
}));

refresh();
setInterval(refresh, 60000);
setInterval(dropCountdown, 1000);
</script>
</body>
</html>
