<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Teacher Profile · Skynet Nexus</title>
  <link rel="icon" type="image/svg+xml" href="/assets/img/logo.svg"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"/>
  <link rel="stylesheet" href="/assets/css/style.css"/>
  <style>
    .tp-wrap { max-width: 800px; margin: 24px auto 60px; padding: 0 20px; }
    .tp-hero { display: flex; gap: 24px; align-items: flex-start; margin: 24px 0; flex-wrap: wrap; }
    .tp-photo { width: 140px; height: 140px; border-radius: 28px; object-fit: cover; flex: none; background: rgba(255,255,255,.06); }
    .tp-photo.fallback { display: flex; align-items: center; justify-content: center; font: 800 48px/1 Inter, sans-serif; color: #0a0e17; }
    .tp-name { margin: 0; font: 800 30px/1.2 Inter, sans-serif; }
    .tp-school { margin: 6px 0 0; color: #00e5ff; font: 600 15px/1.4 Inter, sans-serif; }
    .tp-subjects { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
    .tp-subj { font: 700 12px/1 Inter, sans-serif; padding: 6px 14px; border-radius: 999px; background: rgba(168,85,247,.12); color: #c084fc; border: 1px solid rgba(168,85,247,.4); }
    .tp-quote { margin: 20px 0; padding: 20px 24px; border-left: 4px solid #00e5ff; background: rgba(0,229,255,.05); border-radius: 0 14px 14px 0; font: 500 17px/1.6 Georgia, serif; font-style: italic; color: var(--text, #e6ecf3); }
    .tp-sec { margin: 28px 0; }
    .tp-sec h2 { font: 800 20px/1.3 Inter, sans-serif; margin: 0 0 14px; }
    .tp-bio { font: 500 15px/1.7 Inter, sans-serif; color: var(--muted, #9aa7bd); margin: 0; white-space: pre-wrap; }
    .tp-item { display: flex; gap: 14px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.07); align-items: flex-start; }
    .tp-item:last-child { border-bottom: none; }
    .tp-item .ico { font-size: 24px; flex: none; }
    .tp-item .t { font: 700 15px/1.4 Inter, sans-serif; }
    .tp-item .s { font: 500 13px/1.5 Inter, sans-serif; color: var(--muted, #7c8898); margin-top: 2px; }
    .tp-cta { margin-top: 32px; text-align: center; }
  </style>
</head>
<body>
  <div class="tp-wrap">
    <a href="/" style="color:#00e5ff;text-decoration:none;font:600 13px/1 Inter,sans-serif">← Back to feed</a>
    <div id="tp-root"><p style="color:#7c8898;margin-top:30px">Loading profile…</p></div>
  </div>
<script>
(function () {
  var root = document.getElementById('tp-root');
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  var id = new URLSearchParams(location.search).get('id');
  if (!id) { root.innerHTML = '<p style="color:#ff2e63">No teacher specified.</p>'; return; }
  fetch('/api/teachers/' + encodeURIComponent(id), { credentials: 'same-origin' })
    .then(function (r) { if (!r.ok) throw 0; return r.json(); })
    .then(function (t) {
      document.title = t.name + ' · Teacher · Skynet Nexus';
      var photo = t.profileImage
        ? '<img class="tp-photo" src="' + esc(t.profileImage) + '" alt="' + esc(t.name) + '"/>'
        : '<div class="tp-photo fallback" style="background:' + esc(t.avatarColor || '#00e5ff') + '">' + esc(t.name.slice(0, 2).toUpperCase()) + '</div>';
      var html = '<div class="tp-hero">' + photo + '<div><h1 class="tp-name">' + esc(t.name) + '</h1>' +
        (t.school ? '<p class="tp-school">🏫 ' + esc(t.school) + '</p>' : '') +
        (t.subjects.length ? '<div class="tp-subjects">' + t.subjects.map(function (s) { return '<span class="tp-subj">' + esc(s) + '</span>'; }).join('') + '</div>' : '') + '</div></div>';
      if (t.quote) html += '<div class="tp-quote">“' + esc(t.quote) + '”</div>';
      if (t.bio) html += '<div class="tp-sec"><h2>About</h2><p class="tp-bio">' + esc(t.bio) + '</p></div>';
      if (t.degrees.length) html += '<div class="tp-sec"><h2>🎓 Education</h2>' +
        t.degrees.map(function (d) { return '<div class="tp-item"><div class="ico">🎓</div><div><div class="t">' + esc(d.degree) + '</div><div class="s">' + esc(d.school || '') + (d.year ? ' · ' + esc(d.year) : '') + '</div></div></div>'; }).join('') + '</div>';
      if (t.awards.length) html += '<div class="tp-sec"><h2>🏆 Awards</h2>' +
        t.awards.map(function (a) { return '<div class="tp-item"><div class="ico">🏆</div><div><div class="t">' + esc(a.title) + '</div><div class="s">' + esc(a.org || '') + (a.year ? ' · ' + esc(a.year) : '') + '</div></div></div>'; }).join('') + '</div>';
      html += '<div class="tp-cta"><a href="/pages/register.html" style="display:inline-block;padding:12px 32px;border-radius:999px;background:#00e5ff;color:#0a0e17;font:800 15px/1 Inter,sans-serif;text-decoration:none">Join ' + esc(t.name.split(' ')[0]) + '\'s classroom</a></div>';
      root.innerHTML = html;
    })
    .catch(function () { root.innerHTML = '<p style="color:#7c8898">This teacher\'s profile isn\'t public yet.</p>'; });
})();
</script>
</body>
</html>
