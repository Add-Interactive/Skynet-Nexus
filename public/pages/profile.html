<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>My Dashboard · Skynet Nexus</title>
  <link rel="icon" type="image/svg+xml" href="/assets/img/logo.svg"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@700&display=swap"/>
  <link rel="stylesheet" href="/assets/css/style.css"/>
  <style>
    .dash-wrap { max-width: 1100px; margin: 24px auto 60px; padding: 0 20px; }
    .dash-head { display: flex; align-items: center; gap: 16px; margin: 18px 0 20px; flex-wrap: wrap; }
    .dash-ava { width: 64px; height: 64px; border-radius: 18px; display: flex; align-items: center; justify-content: center; font: 800 24px/1 Inter, sans-serif; color: #0a0e17; flex: none; }
    .dash-head h1 { margin: 0; font: 800 26px/1.2 Inter, sans-serif; }
    .dash-head .sub { margin: 4px 0 0; color: var(--muted, #7c8898); font: 500 14px/1.4 Inter, sans-serif; }
    .role-pills { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
    .role-pill { font: 700 11px/1 Inter, sans-serif; padding: 5px 12px; border-radius: 999px; background: rgba(0,229,255,.12); color: #00e5ff; border: 1px solid rgba(0,229,255,.4); }

    /* Role switcher (multi-role users) */
    .dash-roles { display: flex; gap: 8px; margin: 0 0 20px; }
    .dash-roles button { padding: 10px 24px; border-radius: 12px; border: 1px solid rgba(255,255,255,.15); background: rgba(255,255,255,.03); color: inherit; font: 700 14px/1 Inter, sans-serif; cursor: pointer; }
    .dash-roles button.active { background: #00e5ff; color: #0a0e17; border-color: #00e5ff; }

    /* Win10 tile grid */
    .tile-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
    .tile { border-radius: 16px; padding: 20px; color: #fff; position: relative; overflow: hidden; min-height: 150px; display: flex; flex-direction: column; cursor: pointer; border: none; text-align: left; font-family: Inter, sans-serif; transition: transform .12s, box-shadow .12s; }
    .tile:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,.35); }
    .tile .t-ico { font-size: 32px; margin-bottom: 8px; }
    .tile .t-title { font: 800 17px/1.3 Inter, sans-serif; margin: 0 0 4px; }
    .tile .t-sub { font: 500 13px/1.5 Inter, sans-serif; opacity: .85; margin: 0; }
    .tile .t-big { font: 800 34px/1 Inter, sans-serif; margin: 6px 0 2px; }
    .tile .t-wide { grid-column: span 2; }
    .tile.cyan { background: linear-gradient(135deg, #0891b2, #0e7490); }
    .tile.blue { background: linear-gradient(135deg, #2563eb, #1d4ed8); }
    .tile.green { background: linear-gradient(135deg, #16a34a, #15803d); }
    .tile.gold { background: linear-gradient(135deg, #d97706, #b45309); }
    .tile.purple { background: linear-gradient(135deg, #9333ea, #7e22ce); }
    .tile.orange { background: linear-gradient(135deg, #ea580c, #c2410c); }
    .tile.pink { background: linear-gradient(135deg, #db2777, #be185d); }
    .tile.slate { background: linear-gradient(135deg, #475569, #334155); }
    @media (max-width: 560px) { .tile .t-wide, .tile.t-wide { grid-column: span 1; } }

    /* Class tabs (teacher) */
    .class-tabs { display: flex; gap: 6px; margin: 0 0 18px; flex-wrap: wrap; border-bottom: 2px solid rgba(255,255,255,.08); padding-bottom: 10px; }
    .class-tabs button { padding: 10px 20px; border-radius: 10px 10px 0 0; border: none; background: transparent; color: var(--muted, #7c8898); font: 700 14px/1 Inter, sans-serif; cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -12px; padding-bottom: 12px; }
    .class-tabs button.active { color: #00e5ff; border-bottom-color: #00e5ff; }
    .class-tabs .add-class { color: #39ff14; }

    /* Panels */
    .panel { background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.1); border-radius: 16px; padding: 22px; margin-top: 14px; }
    .panel h2 { margin: 0 0 14px; font: 800 19px/1.3 Inter, sans-serif; }
    .panel.hidden { display: none; }

    /* Kid cards */
    .kid-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
    .kid-card { background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.1); border-radius: 14px; padding: 16px; text-align: center; }
    .kid-card .k-av { width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; font: 800 22px/1 Inter, sans-serif; color: #0a0e17; }
    .kid-card .k-name { font: 700 15px/1.3 Inter, sans-serif; }
    .kid-card .k-meta { font: 500 12px/1.4 Inter, sans-serif; color: var(--muted, #7c8898); margin: 4px 0 10px; }
    .kid-card .k-xp { font: 700 13px/1 Inter, sans-serif; color: #00e5ff; }
    .kid-card button { margin: 4px 2px; padding: 7px 14px; border-radius: 999px; border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.05); color: inherit; font: 700 12px/1 Inter, sans-serif; cursor: pointer; }

    /* Achievement board */
    .badge-wall { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
    .badge { background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.1); border-radius: 12px; padding: 14px 8px; text-align: center; }
    .badge.earned { border-color: rgba(255,176,32,.5); background: rgba(255,176,32,.07); }
    .badge.locked { opacity: .4; filter: grayscale(1); }
    .badge .b-ico { font-size: 28px; }
    .badge .b-name { font: 700 11px/1.3 Inter, sans-serif; margin-top: 6px; }

    /* Student table (teacher) */
    .stu-table { width: 100%; border-collapse: collapse; font: 500 14px/1.5 Inter, sans-serif; }
    .stu-table th { text-align: left; padding: 10px 12px; color: var(--muted, #7c8898); font: 700 12px/1 Inter, sans-serif; text-transform: uppercase; letter-spacing: .04em; border-bottom: 1px solid rgba(255,255,255,.1); }
    .stu-table td { padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,.05); }
    .stu-table tr:hover td { background: rgba(255,255,255,.02); }
    .xp-bar { height: 8px; border-radius: 99px; background: rgba(255,255,255,.1); overflow: hidden; min-width: 80px; }
    .xp-bar > div { height: 100%; border-radius: 99px; background: linear-gradient(90deg, #00e5ff, #a855f7); }

    .btn { display: inline-block; padding: 10px 22px; border-radius: 999px; border: none; background: #00e5ff; color: #0a0e17; font: 800 14px/1 Inter, sans-serif; cursor: pointer; text-decoration: none; }
    .btn.ghost { background: rgba(255,255,255,.06); color: inherit; border: 1px solid rgba(255,255,255,.2); }
    .btn + .btn { margin-left: 8px; }
    .stat-row { display: flex; gap: 24px; flex-wrap: wrap; margin: 6px 0 0; }
    .stat { min-width: 90px; }
    .stat .s-v { font: 800 24px/1 Inter, sans-serif; color: #00e5ff; }
    .stat .s-l { font: 500 12px/1.4 Inter, sans-serif; color: var(--muted, #7c8898); margin-top: 2px; }
  </style>
<style>
.a11y-large { font-size: 118%; }
.a11y-large h1 { font-size: 2.2em; }
.a11y-large p, .a11y-large div { line-height: 1.8; }
.a11y-contrast { --text: #ffffff; --muted: #c8d4e3; }
.a11y-contrast body, .a11y-contrast { background: #000 !important; }
.a11y-contrast .panel, .a11y-contrast .kid-card { border-width: 2px !important; }
</style>
<script src="/assets/js/a11y.js" defer></script>
</head>
<body>
  <div class="dash-wrap">
    <a href="/" class="sky-back" style="color:#00e5ff;text-decoration:none;font:600 13px/1 Inter,sans-serif">← Back to feed</a>
    <div id="dash-root"><p style="color:#7c8898;margin-top:30px">Loading your dashboard…</p></div>
  </div>

<script>
(function () {
  'use strict';
  var root = document.getElementById('dash-root');
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (ch) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]; }); }
  function api(path, opts) {
    return fetch(path, Object.assign({ credentials: 'same-origin', headers: { 'Content-Type': 'application/json' } }, opts || {}))
      .then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (d) {
          if (!r.ok) { var e = new Error('HTTP ' + r.status); e.status = r.status; e.data = d; e.consent_required = !!(d && d.consent_required); throw e; }
          return d;
        });
      });
  }

  // COPPA: verification banner shown when parent email is unverified.
  function showVerifyBanner() {
    if (document.getElementById('coppa-verify-banner')) return;
    var b = document.createElement('div');
    b.id = 'coppa-verify-banner';
    b.style.cssText = 'background:rgba(255,184,0,.12);border:1px solid rgba(255,184,0,.4);border-radius:12px;padding:16px 20px;margin:0 0 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap';
    b.innerHTML = '<span style="font-size:24px">📬</span>' +
      '<div style="flex:1;min-width:200px"><strong>Verify your email</strong><br>' +
      '<span style="font-size:13px;opacity:.8">Click the link we emailed you to unlock kid profiles.</span></div>' +
      '<button class="btn" id="coppa-resend" style="white-space:nowrap">Resend email</button>';
    var main = document.querySelector('.main') || document.body;
    main.insertBefore(b, main.firstChild);
    document.getElementById('coppa-resend').addEventListener('click', function () {
      var btn = this; btn.disabled = true; btn.textContent = 'Sending…';
      api('/api/consent/send-verification', { method: 'POST' }).then(function (d) {
        btn.textContent = d.already_verified ? 'Already verified!' : 'Sent! Check your inbox.';
        if (d.already_verified) setTimeout(function () { location.reload(); }, 1200);
      }).catch(function () { btn.disabled = false; btn.textContent = 'Resend email'; alert('Could not send. Try again.'); });
    });
  }

  // Check verification status on load; show banner if pending.
  api('/api/consent/status').then(function (d) {
    if (d && d.verified === false) showVerifyBanner();
  }).catch(function () {});

  var AVATAR_COLORS = ['#00e5ff', '#a855f7', '#39ff14', '#ffb020', '#ff2e63', '#ff6b35'];
  var AVATAR_EMOJI = ['🦊', '🐱', '🐶', '🦁', '🐼', '🐸', '🦄', '🐙', '🚀', '⭐', '🎨', '⚽'];

  function avatarHtml(name, color, emoji, size, photoUrl) {
    size = size || 64;
    var style = 'width:' + size + 'px;height:' + size + 'px;';
    if (photoUrl) return '<div class="dash-ava" style="' + style + 'padding:0;overflow:hidden"><img src="' + esc(photoUrl) + '" style="width:100%;height:100%;object-fit:cover" onerror="this.remove()"/></div>';
    var bg = color || AVATAR_COLORS[name.length % AVATAR_COLORS.length];
    var face = emoji || name.slice(0, 2).toUpperCase();
    return '<div class="dash-ava" style="' + style + 'background:' + esc(bg) + ';font-size:' + Math.round(size / 2.6) + 'px">' + esc(face) + '</div>';
  }

  /* ============ PARENT DASHBOARD ============ */
  var _currentUser = null;
  function parentDash(user, kids, gam) {
    _currentUser = user;
    var totalXP = kids.reduce(function (s, k) { return s + ((gam[k.id] || {}).xp || 0); }, 0);
    var totalBadges = kids.reduce(function (s, k) { return s + ((gam[k.id] || {}).badges || []).length; }, 0);
    var bestStreak = Math.max.apply(null, [0].concat(kids.map(function (k) { return (gam[k.id] || {}).streak || 0; })));

    var html = '<div class="dash-head">' + avatarHtml(user.name || user.email, user.avatarColor, user.avatarEmoji, 64, user.photoUrl) +
      '<div><h1>' + esc(user.name || 'My Family') + '</h1>' +
      '<p class="sub">Parent dashboard · ' + kids.length + ' kid' + (kids.length === 1 ? '' : 's') + '</p>' +
      '<div class="role-pills">' + user.roles.map(function (r) { return '<span class="role-pill">' + esc(r) + '</span>'; }).join('') + '</div></div></div>';

    html += '<div class="tile-grid">' +
      tile('cyan', '👨‍👩‍👧', 'Family', '<div class="t-big">' + kids.length + '</div>', kids.length + ' kid profiles · ' + totalXP.toLocaleString() + ' total XP', 'kids') +
      tile('gold', '🏆', 'Achievements', '<div class="t-big">' + totalBadges + '</div>', 'badges earned across the family', 'badges') +
      tile('pink', '🌳', 'Family tree', '', 'Link spouses, grandparents & relatives', 'family') +
      '<a href="/pages/chat.html" style="text-decoration:none">' + tile('cyan', '💬', 'Chats', '', 'Family & class conversations', '') + '</a>' +
      tile('gold', '📊', 'Weekly digest', '', 'What your kids read', 'digest') +
      tile('orange', '🏅', 'Family leaderboard', '', 'Sibling XP race', 'board') +
      tile('pink', '🤝', 'Kid friends', '', 'Parent-approved friendships', 'friends') +
      tile('purple', '💬', 'Teacher messages', '', 'Private parent-teacher chat', 'ptmsg') +
      tile('yellow', '👴', 'Family feed', '', 'Cheers & achievements', 'famfeed') +
      tile('gold', '📢', 'Class news', '', 'Teacher announcements', 'pann') +
      tile('green', '🔥', 'Streaks', '<div class="t-big">' + bestStreak + '🔥</div>', 'best reading streak in the family', 'streaks') +
      tile('purple', '🧪', 'Weekend Lab', '', 'Vote Thursday · activities Saturday', null, '/pages/weekend-lab.html') +
      tile('orange', '🧠', 'Daily Quiz', '', 'Tonight\'s 5 questions · leaderboard', null, '/pages/quiz.html') +
      tile('slate', '⚙️', 'Settings', '', 'Profile, notifications, privacy', 'settings') +
      '</div>';

    // Panels
    html += '<div class="panel" id="p-kids"><h2>🧒 Kid profiles</h2><div class="kid-grid">' +
      kids.map(function (k) {
        var g = gam[k.id] || {};
        return '<div class="kid-card" data-kid-dash="' + k.id + '" style="cursor:pointer"><div class="k-av" style="background:' + esc(k.avatarColor || '#00e5ff') + '">' + esc(k.avatarEmoji || k.name.slice(0, 2).toUpperCase()) + '</div>' +
          '<div class="k-name">' + esc(k.name) + '</div><div class="k-meta">Age ' + (new Date().getFullYear() - k.birthYear) + ' · Level ' + esc(g.level || 'Rookie Reader') + '</div>' +
          '<div class="k-xp">' + (g.xp || 0).toLocaleString() + ' XP · ' + (g.streak || 0) + '🔥</div>' +
          '<div style="margin-top:10px"><button data-edit-kid="' + k.id + '">Edit</button><button data-ctrl-kid="' + k.id + '">Controls</button><button data-hist-kid="' + k.id + '">History</button></div></div>';
      }).join('') +
      (kids.length < 6 ? '<div class="kid-card" style="display:flex;align-items:center;justify-content:center;min-height:180px;cursor:pointer;border-style:dashed" id="add-kid"><span style="font-size:15px;color:#39ff14">＋ Add a kid</span></div>' : '') +
      '</div></div>';

    html += '<div class="panel hidden" id="p-family"><h2>🌳 Family tree</h2>' +
      '<div id="fam-body"><p style="color:#7c8898">Loading family…</p></div></div>';

    html += '<div class="panel" id="p-safety" style="border-color:rgba(57,255,20,.35)"><h2>🛡️ How we protect your children</h2>' +
      '<div style="display:grid;gap:10px;font-size:14px;line-height:1.6;color:var(--muted,#9aa7bd)">' +
      '<div><b style="color:#39ff14">1. Family-only by invite.</b> Only someone with your family invite code can join. No strangers, no open signup to your family.</div>' +
      '<div><b style="color:#39ff14">2. You own your kids\' data.</b> Only the parent who created a kid profile can see or edit it. Grandparents and relatives see only what you choose to share.</div>' +
      '<div><b style="color:#39ff14">3. Teachers can\'t add your child.</b> A teacher sends <i>you</i> an invite — you create the account, you link your child. Teachers never touch kid accounts directly.</div>' +
      '<div><b style="color:#39ff14">4. Teachers see classroom stats only.</b> XP, streaks, reading progress — never personal details, never your family tree.</div>' +
      '<div><b style="color:#39ff14">5. Kid friends need two parents\' approval.</b> Kids can friend other kids via friend codes — but <i>both</i> parents must approve before they can chat. Either parent can revoke anytime. No searchable kid directory exists.</div>' +
      '<div><b style="color:#39ff14">6. Leave anytime.</b> Remove a family member or unlink a classroom instantly — no questions, no waiting.</div>' +
      '</div></div>';

    html += '<div class="panel hidden" id="p-digest"><h2>📊 Weekly digest</h2><div id="digest-body"><p style="color:#7c8898">Loading…</p></div></div>';
    html += '<div class="panel hidden" id="p-board"><h2>🏅 Family leaderboard</h2><div id="board-body"><p style="color:#7c8898">Loading…</p></div></div>';
    html += '<div class="panel hidden" id="p-friends"><h2>🤝 Kid friends</h2><div id="friends-body"><p style="color:#7c8898">Loading…</p></div></div>';
    html += '<div class="panel hidden" id="p-ptmsg"><h2>💬 Teacher messages</h2><div id="ptmsg-body"><p style="color:#7c8898">Loading…</p></div></div>';
    html += '<div class="panel hidden" id="p-famfeed"><h2>👴 Family feed</h2><div id="famfeed-body"><p style="color:#7c8898">Loading…</p></div></div>';
    html += '<div class="panel hidden" id="p-pann"><h2>📢 Class news</h2><div id="pann-body"><p style="color:#7c8898">Loading…</p></div></div>';
    html += '<div class="panel hidden" id="p-badges"><h2>🏆 Achievement board</h2>' +
      '<p style="color:var(--muted,#7c8898);font-size:14px;margin:0 0 16px">Every badge the family has earned — and what\'s still to unlock.</p>' +
      '<div class="badge-wall" id="badge-wall"><p style="color:#7c8898">Loading badges…</p></div></div>';

    html += '<div class="panel hidden" id="p-settings"><h2>⚙️ Settings</h2>' +
      '<div id="edit-profile"><p style="color:#7c8898">Loading…</p></div>' +
      '<p style="margin-top:14px"><button class="btn ghost" id="btn-notif">🔔 Enable drop alerts</button></p></div>';

    root.innerHTML = html;
    bindParentTiles();
    loadBadges(kids);
  }

  function tile(color, ico, title, big, sub, panelId, href) {
    var inner = '<div class="t-ico">' + ico + '</div><div class="t-title">' + title + '</div>' + big + '<p class="t-sub">' + sub + '</p>';
    if (href) return '<a class="tile ' + color + '" href="' + href + '" style="text-decoration:none">' + inner + '</a>';
    return '<button class="tile ' + color + '"' + (panelId ? ' data-panel="p-' + panelId + '"' : '') + '>' + inner + '</button>';
  }

  var KID_COLORS = ['#39ff14', '#00e5ff', '#ff2e63', '#ffd166', '#a855f7', '#ff9f1c', '#06d6a0', '#ef476f'];
  var KID_EMOJIS = ['🚀', '🦄', '🐱', '🐶', '🦖', '🌟', '🎮', '🚗', '🦋', '🐙', '🤖', '🧙'];
  var _kidsCache = [];
  function kidModal(kid) {
    var isEdit = !!kid;
    kid = kid || {};
    var yr = new Date().getFullYear();
    var yearOpts = '';
    for (var y = yr - 2; y >= yr - 18; y--) yearOpts += '<option value="' + y + '"' + (kid.birthYear == y ? ' selected' : '') + '>' + y + '</option>';
    var m = document.createElement('div');
    m.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:999;padding:20px';
    m.innerHTML = '<div style="background:#0f1522;border:1px solid rgba(0,229,255,.3);border-radius:16px;padding:24px;max-width:400px;width:100%">' +
      '<h3 style="margin:0 0 16px">' + (isEdit ? 'Edit kid' : 'Add a kid') + '</h3>' +
      '<label style="display:block;font:700 12px/1 Inter,sans-serif;margin:12px 0 6px">Name</label>' +
      '<input id="km-name" value="' + esc(kid.name || '') + '" maxlength="40" placeholder="First name" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.05);color:inherit"/>' +
      '<label style="display:block;font:700 12px/1 Inter,sans-serif;margin:12px 0 6px">Birth year</label>' +
      '<select id="km-year" style="width:100%;padding:10px;border-radius:8px;background:#0b1026;color:inherit">' + yearOpts + '</select>' +
      '<label style="display:block;font:700 12px/1 Inter,sans-serif;margin:12px 0 6px">Avatar color</label>' +
      '<div id="km-colors" style="display:flex;gap:8px;flex-wrap:wrap">' +
      KID_COLORS.map(function (c) { return '<div data-c="' + c + '" style="width:36px;height:36px;border-radius:50%;background:' + c + ';cursor:pointer;border:' + ((kid.avatarColor || KID_COLORS[0]) === c ? '3px solid #fff' : '3px solid transparent') + '"></div>'; }).join('') + '</div>' +
      '<label style="display:block;font:700 12px/1 Inter,sans-serif;margin:12px 0 6px">Avatar emoji</label>' +
      '<div id="km-emojis" style="display:flex;gap:6px;flex-wrap:wrap;font-size:24px">' +
      KID_EMOJIS.map(function (e) { return '<div data-e="' + e + '" style="cursor:pointer;padding:4px;border-radius:8px;background:' + ((kid.avatarEmoji || KID_EMOJIS[0]) === e ? 'rgba(0,229,255,.25)' : 'transparent') + '">' + e + '</div>'; }).join('') + '</div>' +
      '<div style="margin-top:16px;padding:14px;border:1px solid rgba(57,255,20,.3);border-radius:10px;background:rgba(57,255,20,.04)">' +
      '<div style="font:700 13px/1 Inter,sans-serif;margin-bottom:8px">♿ Accessibility needs</div>' +
      '<label style="display:flex;align-items:center;gap:8px;font-size:13px;margin:6px 0"><input type="checkbox" id="km-blind"/> My child is blind</label>' +
      '<label style="display:flex;align-items:center;gap:8px;font-size:13px;margin:6px 0"><input type="checkbox" id="km-lowvision"/> Low vision (large text + high contrast)</label>' +
      '<div style="font-size:12px;color:var(--muted,#7c8898);margin-top:6px">Declaring blindness enables the full audio guide, voice commands, and gesture navigation.</div></div>' +
      '<div style="display:flex;gap:10px;margin-top:20px">' +
      '<button class="btn" id="km-save" style="flex:1">' + (isEdit ? 'Save' : 'Add kid') + '</button>' +
      (isEdit ? '<button class="btn ghost" id="km-del" style="color:#ff2e63">Remove</button>' : '') +

      tile('orange', '📝', 'Assignments', '<div class="t-big">' + active + '</div>', assigns.length + ' total · ' + active + ' active', 'assignments') +
      tile('green', '📊', 'Progress', '', 'Leaderboard & reading stats', 'progress') +
      tile('purple', '💬', 'Discussions', '', 'Class threads & Q&A', null, '/pages/classroom.html') +
      tile('gold', '🧠', 'Quiz', '', 'Tonight\'s results & leaderboard', null, '/pages/quiz.html') +
      tile('cyan', '⚡', 'Quick actions', '', 'New assignment · discussion · announcement', 'actions') +

  var CLASS_CHANNELS = ['ai','space','robotics','biotech','quantum','climate','engineering','math','cyber','gaming','music','stem','play'];
  function loadClassSettings(classId) {
    var b = document.getElementById('cs-body');
    api('/api/classrooms/' + classId + '/settings').then(function (d) {
      var s = d.settings || {};
      var allowed = s.channels && s.channels.length ? s.channels : CLASS_CHANNELS.slice();
      b.innerHTML =
        '<label style="display:flex;align-items:center;gap:8px;font-size:14px;margin:10px 0"><input type="checkbox" id="cs-listen" ' + (s.listenEnabled ? 'checked' : '') + '/> 🔊 Listen feature for this class</label>' +
        '<div style="font:700 13px/1 Inter,sans-serif;margin:16px 0 8px">📰 Channels visible to students</div>' +
        '<div style="display:flex;gap:6px;flex-wrap:wrap" id="cs-channels">' +
        CLASS_CHANNELS.map(function (c) {
          var on = allowed.indexOf(c) !== -1;
          return '<button data-ch="' + c + '" style="padding:6px 12px;border-radius:999px;font:700 12px/1 Inter,sans-serif;cursor:pointer;border:1px solid ' + (on ? '#00e5ff' : 'rgba(255,255,255,.2)') + ';background:' + (on ? 'rgba(0,229,255,.15)' : 'transparent') + ';color:' + (on ? '#00e5ff' : '#7c8898') + '">' + c + '</button>';
        }).join('') + '</div>' +
        '<button class="btn" id="cs-save" style="margin-top:16px">Save class settings</button>' +
        '<p style="font-size:12px;color:var(--muted,#7c8898);margin-top:10px">Note: parents can further restrict channels per kid — your settings are the classroom default.</p>';
      var sel = allowed.slice();
      b.querySelectorAll('[data-ch]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var c = btn.getAttribute('data-ch');
          var i = sel.indexOf(c);
          if (i === -1) sel.push(c); else sel.splice(i, 1);
          var on = sel.indexOf(c) !== -1;
          btn.style.border = on ? '1px solid #00e5ff' : '1px solid rgba(255,255,255,.2)';
          btn.style.background = on ? 'rgba(0,229,255,.15)' : 'transparent';
          btn.style.color = on ? '#00e5ff' : '#7c8898';
        });
      });
      document.getElementById('cs-save').addEventListener('click', function () {
        api('/api/classrooms/' + classId + '/settings', { method: 'PUT', body: JSON.stringify({
          listenEnabled: document.getElementById('cs-listen').checked, channels: sel }) })
          .then(function () { alert('Class settings saved!'); }).catch(function () { alert('Could not save.'); });
      });
    }).catch(function () { b.innerHTML = '<p style="color:#ff2e63">Could not load.</p>'; });
  }

      m.innerHTML = '<div style="background:#0f1522;border:1px solid rgba(0,229,255,.3);border-radius:16px;padding:24px;max-width:380px;width:100%">' +

      document.body.appendChild(m);
      var input = document.getElementById('nc-name');
      input.focus();
      document.getElementById('nc-cancel').addEventListener('click', function () { m.remove(); });
      m.addEventListener('click', function (e) { if (e.target === m) m.remove(); });
      function go() {
        var name = input.value.trim();
        if (!name) { input.focus(); return; }
        api('/api/classrooms', { method: 'POST', body: JSON.stringify({ name: name }) })
          .then(function () { location.reload(); })
          .catch(function () { alert('Could not create class.'); });
      }
      document.getElementById('nc-go').addEventListener('click', go);
      input.addEventListener('keydown', function (e) { if (e.key === 'Enter') go(); });
    });
  }

      var kidOpts = kids.map(function (k) { return '<option value="' + k.id + '">' + esc(k.name) + '</option>'; }).join('');
      var div = document.createElement('div');
      div.className = 'panel';
      div.style.borderColor = 'rgba(0,229,255,.5)';
      div.innerHTML = '<h2>🎓 Classroom invite</h2><p style="color:var(--muted)">A teacher invited you to link your child to their class. Choose which kid to enroll:</p>' +
        '<p><select id="ci-kid" style="padding:10px;border-radius:8px;background:#0b1026;color:inherit">' + kidOpts + '</select> ' +
        '<button class="btn" id="ci-join">Link to classroom</button></p>';
      document.getElementById('root').prepend(div);
      document.getElementById('ci-join').addEventListener('click', function () {
        api('/api/classrooms/join', { method: 'POST', body: JSON.stringify({ code: code, kidId: document.getElementById('ci-kid').value }) })
          .then(function () { alert('Linked! Your child is now in the classroom.'); history.replaceState(null, '', location.pathname); div.remove(); })
          .catch(function () { alert('Invalid or expired invite.'); });
      });
    });
  }
  function boot() {
    api('/api/auth/me').then(function (d) {
      var user = d.user;
      if (!user) { location.href = '/pages/login.html'; return; }
      var roles = user.roles || [user.role || 'parent'];
      user.roles = roles;
      var isTeacher = roles.indexOf('teacher') !== -1 || roles.indexOf('admin') !== -1;
      var isParent = roles.indexOf('parent') !== -1 || !isTeacher;

      // Multi-role: show switcher
      if (roles.indexOf('teacher') !== -1 && roles.indexOf('parent') !== -1) {
        showRoleSwitcher(user);
        return;
      }
      if (isTeacher) loadTeacher(user);
      else { loadParent(user); checkClassInvite(); checkConsent(); }
    }).catch(function () { location.href = '/pages/login.html'; });
  }

  function showRoleSwitcher(user) {
    root.innerHTML = '<div class="dash-head">' + avatarHtml(user.name || user.email, user.avatarColor, user.avatarEmoji, 64, user.photoUrl) +
      '<div><h1>' + esc(user.name || 'Dashboard') + '</h1><p class="sub">Choose your view</p></div></div>' +
      '<div class="dash-roles"><button id="sw-parent" class="active">👨‍👩‍👧 Parent</button><button id="sw-teacher">🏫 Teacher</button></div>' +
      '<div id="role-body"></div>';
    var body = document.getElementById('role-body');
    var bp = document.getElementById('sw-parent'), bt = document.getElementById('sw-teacher');
    // Temporarily swap root for sub-renders
    var realRoot = root;
    function showParent() {
      bp.classList.add('active'); bt.classList.remove('active');
      root = body; loadParent(user); root = realRoot; checkClassInvite();
    }
    function showTeacher() {
      bt.classList.add('active'); bp.classList.remove('active');
      root = body; loadTeacher(user); root = realRoot;
    }
    bp.addEventListener('click', showParent);
    bt.addEventListener('click', showTeacher);
    showParent();
  }

  function loadParent(user) {
    Promise.all([
      api('/api/kids').catch(function () { return { kids: [] }; }),
      api('/api/gamification/status').catch(function () { return { kids: [] }; }),
    ]).then(function (rs) {
      var kids = rs[0].kids || rs[0] || [];
      _kidsCache = kids;
      try {
        if (kids.length && !localStorage.getItem('nexus_active_kid')) {
          localStorage.setItem('nexus_active_kid', kids[0].id);
        }
      } catch (e) {}
      var gam = {};
      (rs[1].kids || []).forEach(function (k) { gam[k.id] = k; });
      parentDash(user, kids, gam);
    });
  }

  function loadTeacher(user) {
    api('/api/classrooms').then(function (d) {
      teacherDash(user, d.classrooms || d || []);
    }).catch(function () {
      teacherDash(user, []);
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
