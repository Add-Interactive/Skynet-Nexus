<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>My Dashboard · Skynet Nexus</title>
  <link rel="icon" type="image/svg+xml" href="/assets/img/logo.svg"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@700&display=swap"/>
  <link rel="stylesheet" href="/assets/css/style.css"/>
  <style>
    .dash-wrap { max-width: 1100px; margin: 24px auto 60px; padding: 0 20px; }
    .dash-head { display: flex; align-items: center; gap: 16px; margin: 18px 0 20px; flex-wrap: wrap; }
    .dash-ava { width: 64px; height: 64px; border-radius: 18px; display: flex; align-items: center; justify-content: center; font: 800 24px/1 Inter, sans-serif; color: #0a0e17; flex: none; }
    .dash-head h1 { margin: 0; font: 800 26px/1.2 Inter, sans-serif; }
    .dash-head .sub { margin: 4px 0 0; color: var(--muted, #7c8898); font: 500 14px/1.4 Inter, sans-serif; }
    .role-pills { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
    .role-pill { font: 700 11px/1 Inter, sans-serif; padding: 5px 12px; border-radius: 999px; background: rgba(0,229,255,.12); color: #00e5ff; border: 1px solid rgba(0,229,255,.4); }

    /* Role switcher (multi-role users) */
    .dash-roles { display: flex; gap: 8px; margin: 0 0 20px; }
    .dash-roles button { padding: 10px 24px; border-radius: 12px; border: 1px solid rgba(255,255,255,.15); background: rgba(255,255,255,.03); color: inherit; font: 700 14px/1 Inter, sans-serif; cursor: pointer; }
    .dash-roles button.active { background: #00e5ff; color: #0a0e17; border-color: #00e5ff; }

    /* Win10 tile grid */
    .tile-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
    .tile { border-radius: 16px; padding: 20px; color: #fff; position: relative; overflow: hidden; min-height: 150px; display: flex; flex-direction: column; cursor: pointer; border: none; text-align: left; font-family: Inter, sans-serif; transition: transform .12s, box-shadow .12s; }
    .tile:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,.35); }
    .tile .t-ico { font-size: 32px; margin-bottom: 8px; }
    .tile .t-title { font: 800 17px/1.3 Inter, sans-serif; margin: 0 0 4px; }
    .tile .t-sub { font: 500 13px/1.5 Inter, sans-serif; opacity: .85; margin: 0; }
    .tile .t-big { font: 800 34px/1 Inter, sans-serif; margin: 6px 0 2px; }
    .tile .t-wide { grid-column: span 2; }
    .tile.cyan { background: linear-gradient(135deg, #0891b2, #0e7490); }
    .tile.blue { background: linear-gradient(135deg, #2563eb, #1d4ed8); }
    .tile.green { background: linear-gradient(135deg, #16a34a, #15803d); }
    .tile.gold { background: linear-gradient(135deg, #d97706, #b45309); }
    .tile.purple { background: linear-gradient(135deg, #9333ea, #7e22ce); }
    .tile.orange { background: linear-gradient(135deg, #ea580c, #c2410c); }
    .tile.pink { background: linear-gradient(135deg, #db2777, #be185d); }
    .tile.slate { background: linear-gradient(135deg, #475569, #334155); }
    @media (max-width: 560px) { .tile .t-wide, .tile.t-wide { grid-column: span 1; } }

    /* Class tabs (teacher) */
    .class-tabs { display: flex; gap: 6px; margin: 0 0 18px; flex-wrap: wrap; border-bottom: 2px solid rgba(255,255,255,.08); padding-bottom: 10px; }
    .class-tabs button { padding: 10px 20px; border-radius: 10px 10px 0 0; border: none; background: transparent; color: var(--muted, #7c8898); font: 700 14px/1 Inter, sans-serif; cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -12px; padding-bottom: 12px; }
    .class-tabs button.active { color: #00e5ff; border-bottom-color: #00e5ff; }
    .class-tabs .add-class { color: #39ff14; }

    /* Panels */
    .panel { background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.1); border-radius: 16px; padding: 22px; margin-top: 14px; }
    .panel h2 { margin: 0 0 14px; font: 800 19px/1.3 Inter, sans-serif; }
    .panel.hidden { display: none; }

    /* Kid cards */
    .kid-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
    .kid-card { background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.1); border-radius: 14px; padding: 16px; text-align: center; }
    .kid-card .k-av { width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; font: 800 22px/1 Inter, sans-serif; color: #0a0e17; }
    .kid-card .k-name { font: 700 15px/1.3 Inter, sans-serif; }
    .kid-card .k-meta { font: 500 12px/1.4 Inter, sans-serif; color: var(--muted, #7c8898); margin: 4px 0 10px; }
    .kid-card .k-xp { font: 700 13px/1 Inter, sans-serif; color: #00e5ff; }
    .kid-card button { margin: 4px 2px; padding: 7px 14px; border-radius: 999px; border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.05); color: inherit; font: 700 12px/1 Inter, sans-serif; cursor: pointer; }

    /* Achievement board */
    .badge-wall { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
    .badge { background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.1); border-radius: 12px; padding: 14px 8px; text-align: center; }
    .badge.earned { border-color: rgba(255,176,32,.5); background: rgba(255,176,32,.07); }
    .badge.locked { opacity: .4; filter: grayscale(1); }
    .badge .b-ico { font-size: 28px; }
    .badge .b-name { font: 700 11px/1.3 Inter, sans-serif; margin-top: 6px; }

    /* Student table (teacher) */
    .stu-table { width: 100%; border-collapse: collapse; font: 500 14px/1.5 Inter, sans-serif; }
    .stu-table th { text-align: left; padding: 10px 12px; color: var(--muted, #7c8898); font: 700 12px/1 Inter, sans-serif; text-transform: uppercase; letter-spacing: .04em; border-bottom: 1px solid rgba(255,255,255,.1); }
    .stu-table td { padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,.05); }
    .stu-table tr:hover td { background: rgba(255,255,255,.02); }
    .xp-bar { height: 8px; border-radius: 99px; background: rgba(255,255,255,.1); overflow: hidden; min-width: 80px; }
    .xp-bar > div { height: 100%; border-radius: 99px; background: linear-gradient(90deg, #00e5ff, #a855f7); }

    .btn { display: inline-block; padding: 10px 22px; border-radius: 999px; border: none; background: #00e5ff; color: #0a0e17; font: 800 14px/1 Inter, sans-serif; cursor: pointer; text-decoration: none; }
    .btn.ghost { background: rgba(255,255,255,.06); color: inherit; border: 1px solid rgba(255,255,255,.2); }
    .btn + .btn { margin-left: 8px; }
    .stat-row { display: flex; gap: 24px; flex-wrap: wrap; margin: 6px 0 0; }
    .stat { min-width: 90px; }
    .stat .s-v { font: 800 24px/1 Inter, sans-serif; color: #00e5ff; }
    .stat .s-l { font: 500 12px/1.4 Inter, sans-serif; color: var(--muted, #7c8898); margin-top: 2px; }
  </style>
</head>
<body>
  <div class="dash-wrap">
    <a href="/" class="sky-back" style="color:#00e5ff;text-decoration:none;font:600 13px/1 Inter,sans-serif">← Back to feed</a>
    <div id="dash-root"><p style="color:#7c8898;margin-top:30px">Loading your dashboard…</p></div>
  </div>

<script>
(function () {
  'use strict';
  var root = document.getElementById('dash-root');
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (ch) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]; }); }
  function api(path, opts) {
    return fetch(path, Object.assign({ credentials: 'same-origin', headers: { 'Content-Type': 'application/json' } }, opts || {}))
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
  }

  var AVATAR_COLORS = ['#00e5ff', '#a855f7', '#39ff14', '#ffb020', '#ff2e63', '#ff6b35'];
  var AVATAR_EMOJI = ['🦊', '🐱', '🐶', '🦁', '🐼', '🐸', '🦄', '🐙', '🚀', '⭐', '🎨', '⚽'];

  function avatarHtml(name, color, emoji, size) {
    size = size || 64;
    var bg = color || AVATAR_COLORS[name.length % AVATAR_COLORS.length];
    var face = emoji || name.slice(0, 2).toUpperCase();
    return '<div class="dash-ava" style="width:' + size + 'px;height:' + size + 'px;background:' + esc(bg) + ';font-size:' + Math.round(size / 2.6) + 'px">' + esc(face) + '</div>';
  }

  /* ============ PARENT DASHBOARD ============ */
  function parentDash(user, kids, gam) {
    var totalXP = kids.reduce(function (s, k) { return s + ((gam[k.id] || {}).xp || 0); }, 0);
    var totalBadges = kids.reduce(function (s, k) { return s + ((gam[k.id] || {}).badges || []).length; }, 0);
    var bestStreak = Math.max.apply(null, [0].concat(kids.map(function (k) { return (gam[k.id] || {}).streak || 0; })));

    var html = '<div class="dash-head">' + avatarHtml(user.name || user.email, user.avatarColor, user.avatarEmoji) +
      '<div><h1>' + esc(user.name || 'My Family') + '</h1>' +
      '<p class="sub">Parent dashboard · ' + kids.length + ' kid' + (kids.length === 1 ? '' : 's') + '</p>' +
      '<div class="role-pills">' + user.roles.map(function (r) { return '<span class="role-pill">' + esc(r) + '</span>'; }).join('') + '</div></div></div>';

    html += '<div class="tile-grid">' +
      tile('cyan', '👨‍👩‍👧', 'Family', '<div class="t-big">' + kids.length + '</div>', kids.length + ' kid profiles · ' + totalXP.toLocaleString() + ' total XP', 'kids') +
      tile('gold', '🏆', 'Achievements', '<div class="t-big">' + totalBadges + '</div>', 'badges earned across the family', 'badges') +
      tile('green', '🔥', 'Streaks', '<div class="t-big">' + bestStreak + '🔥</div>', 'best reading streak in the family', 'streaks') +
      tile('purple', '🧪', 'Weekend Lab', '', 'Vote Thursday · activities Saturday', null, '/pages/weekend-lab.html') +
      tile('orange', '🧠', 'Daily Quiz', '', 'Tonight\'s 5 questions · leaderboard', null, '/pages/quiz.html') +
      tile('slate', '⚙️', 'Settings', '', 'Profile, notifications, privacy', 'settings') +
      '</div>';

    // Panels
    html += '<div class="panel" id="p-kids"><h2>🧒 Kid profiles</h2><div class="kid-grid">' +
      kids.map(function (k) {
        var g = gam[k.id] || {};
        return '<div class="kid-card"><div class="k-av" style="background:' + esc(k.avatarColor || '#00e5ff') + '">' + esc(k.avatarEmoji || k.name.slice(0, 2).toUpperCase()) + '</div>' +
          '<div class="k-name">' + esc(k.name) + '</div><div class="k-meta">Age ' + (new Date().getFullYear() - k.birthYear) + ' · Level ' + esc(g.level || 'Rookie Reader') + '</div>' +
          '<div class="k-xp">' + (g.xp || 0).toLocaleString() + ' XP · ' + (g.streak || 0) + '🔥</div>' +
          '<div style="margin-top:10px"><button data-edit-kid="' + k.id + '">Edit</button><button data-avatar-kid="' + k.id + '">Avatar</button></div></div>';
      }).join('') +
      (kids.length < 6 ? '<div class="kid-card" style="display:flex;align-items:center;justify-content:center;min-height:180px;cursor:pointer;border-style:dashed" id="add-kid"><span style="font-size:15px;color:#39ff14">＋ Add a kid</span></div>' : '') +
      '</div></div>';

    html += '<div class="panel hidden" id="p-badges"><h2>🏆 Achievement board</h2>' +
      '<p style="color:var(--muted,#7c8898);font-size:14px;margin:0 0 16px">Every badge the family has earned — and what\'s still to unlock.</p>' +
      '<div class="badge-wall" id="badge-wall"><p style="color:#7c8898">Loading badges…</p></div></div>';

    html += '<div class="panel hidden" id="p-settings"><h2>⚙️ Settings</h2>' +
      '<p><a class="btn ghost" href="/pages/profile.html?legacy=1">Edit profile details</a></p>' +
      '<p style="margin-top:14px"><button class="btn ghost" id="btn-notif">🔔 Enable drop alerts</button></p></div>';

    root.innerHTML = html;
    bindParentTiles();
    loadBadges(kids);
  }

  function tile(color, ico, title, big, sub, panelId, href) {
    var inner = '<div class="t-ico">' + ico + '</div><div class="t-title">' + title + '</div>' + big + '<p class="t-sub">' + sub + '</p>';
    if (href) return '<a class="tile ' + color + '" href="' + href + '" style="text-decoration:none">' + inner + '</a>';
    return '<button class="tile ' + color + '"' + (panelId ? ' data-panel="p-' + panelId + '"' : '') + '>' + inner + '</button>';
  }

  function bindParentTiles() {
    root.querySelectorAll('[data-panel]').forEach(function (t) {
      t.addEventListener('click', function () {
        var id = t.getAttribute('data-panel');
        root.querySelectorAll('.panel').forEach(function (p) { p.classList.add('hidden'); });
        var el = document.getElementById(id);
        if (el) { el.classList.remove('hidden'); el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
      });
    });
    var nk = document.getElementById('btn-notif');
    if (nk) nk.addEventListener('click', function () {
      if (!('Notification' in window)) { alert('Notifications not supported in this browser.'); return; }
      Notification.requestPermission().then(function (p) {
        nk.textContent = p === 'granted' ? '✓ Drop alerts on' : '🔔 Enable drop alerts';
      });
    });
  }

  var ALL_BADGES = [
    ['📖', 'First Story'], ['🔥', '3-Day Streak'], ['🔥🔥', '7-Day Streak'], ['🏆', '30-Day Streak'],
    ['🚀', 'Space Explorer'], ['🤖', 'Robotics Explorer'], ['🎮', 'Gaming Explorer'], ['🎵', 'Music Explorer'],
    ['🧪', 'STEM Explorer'], ['🌍', 'Climate Explorer'], ['🧬', 'Biotech Explorer'], ['⚛️', 'Quantum Explorer'],
    ['➗', 'Math Explorer'], ['🔒', 'Cyber Explorer'], ['💡', 'AI Explorer'], ['🔧', 'Engineering Explorer'],
    ['🎓', 'Scholar'], ['👑', 'Editor-in-Chief'], ['💬', 'Debater'], ['❓', 'Curious Mind'],
  ];
  function loadBadges(kids) {
    var wall = document.getElementById('badge-wall');
    if (!wall) return;
    api('/api/gamification/status').then(function (d) {
      var earned = {};
      (d.kids || []).forEach(function (k) { (k.badges || []).forEach(function (b) { earned[b] = true; }); });
      wall.innerHTML = ALL_BADGES.map(function (bd) {
        var got = earned[bd[1]];
        return '<div class="badge ' + (got ? 'earned' : 'locked') + '"><div class="b-ico">' + bd[0] + '</div><div class="b-name">' + esc(bd[1]) + '</div></div>';
      }).join('');
    }).catch(function () { wall.innerHTML = '<p style="color:#7c8898">Could not load badges.</p>'; });
  }

  /* ============ TEACHER DASHBOARD ============ */
  function teacherDash(user, classrooms) {
    var html = '<div class="dash-head">' + avatarHtml(user.name || user.email, user.avatarColor, user.avatarEmoji) +
      '<div><h1>' + esc(user.name || 'Teacher') + '</h1>' +
      '<p class="sub">Teacher dashboard · ' + classrooms.length + ' class' + (classrooms.length === 1 ? '' : 'es') + '</p>' +
      '<div class="role-pills">' + user.roles.map(function (r) { return '<span class="role-pill">' + esc(r) + '</span>'; }).join('') + '</div></div></div>';

    if (!classrooms.length) {
      html += '<div class="panel"><h2>🏫 No classes yet</h2><p style="color:var(--muted)">Create your first class to unlock the teacher dashboard.</p>' +
        '<p style="margin-top:12px"><button class="btn" id="btn-new-class">＋ Create a class</button></p></div>';
      root.innerHTML = html;
      bindNewClass();
      return;
    }

    html += '<div class="class-tabs" id="class-tabs">' +
      classrooms.map(function (c, i) { return '<button data-class="' + c.id + '" class="' + (i === 0 ? 'active' : '') + '">' + esc(c.name) + '</button>'; }).join('') +
      '<button class="add-class" id="btn-new-class">＋ New class</button></div>';

    html += '<div id="class-body"><p style="color:#7c8898">Loading class…</p></div>';
    root.innerHTML = html;
    bindNewClass();

    var tabs = root.querySelectorAll('#class-tabs [data-class]');
    tabs.forEach(function (t) {
      t.addEventListener('click', function () {
        tabs.forEach(function (x) { x.classList.remove('active'); });
        t.classList.add('active');
        loadClass(t.getAttribute('data-class'));
      });
    });
    loadClass(classrooms[0].id);
  }

  function loadClass(classId) {
    var body = document.getElementById('class-body');
    body.innerHTML = '<p style="color:#7c8898">Loading class…</p>';
    Promise.all([
      api('/api/classrooms/' + classId + '/students').catch(function () { return { students: [] }; }),
      api('/api/classrooms/' + classId + '/progress').catch(function () { return { progress: [] }; }),
      api('/api/assignments?classroom=' + classId).catch(function () { return { assignments: [] }; }),
    ]).then(function (rs) {
      var students = rs[0].students || rs[0] || [];
      var progress = rs[1].progress || rs[1] || [];
      var assigns = rs[2].assignments || rs[2] || [];
      renderClassTiles(classId, students, progress, assigns);
    });
  }

  function renderClassTiles(classId, students, progress, assigns) {
    var body = document.getElementById('class-body');
    var active = assigns.filter(function (a) { return !a.completed; }).length;
    var avgXP = students.length ? Math.round(students.reduce(function (s, x) { return s + (x.xp || 0); }, 0) / students.length) : 0;
    var topStreak = Math.max.apply(null, [0].concat(students.map(function (x) { return x.streak || 0; })));

    var html = '<div class="tile-grid">' +
      tile('blue', '👥', 'Students', '<div class="t-big">' + students.length + '</div>', 'avg ' + avgXP.toLocaleString() + ' XP · best streak ' + topStreak + '🔥', 'students') +
      tile('orange', '📝', 'Assignments', '<div class="t-big">' + active + '</div>', assigns.length + ' total · ' + active + ' active', 'assignments') +
      tile('green', '📊', 'Progress', '', 'Leaderboard & reading stats', 'progress') +
      tile('purple', '💬', 'Discussions', '', 'Class threads & Q&A', null, '/pages/classroom.html') +
      tile('gold', '🧠', 'Quiz', '', 'Tonight\'s results & leaderboard', null, '/pages/quiz.html') +
      tile('cyan', '⚡', 'Quick actions', '', 'New assignment · discussion · announcement', 'actions') +
      '</div>';

    // Students panel
    html += '<div class="panel" id="p-students"><h2>👥 Students</h2>' +
      (students.length ? '<table class="stu-table"><tr><th>Student</th><th>Level</th><th>XP</th><th>Streak</th><th>Progress</th></tr>' +
        students.map(function (s) {
          var pct = Math.min(100, Math.round((s.xp || 0) / 100));
          return '<tr><td>' + esc(s.name) + '</td><td>' + esc(s.level || '—') + '</td><td>' + (s.xp || 0).toLocaleString() + '</td><td>' + (s.streak || 0) + '🔥</td>' +
            '<td><div class="xp-bar"><div style="width:' + pct + '%"></div></div></td></tr>';
        }).join('') + '</table>'
        : '<p style="color:var(--muted)">No students yet. Add them below.</p>') +
      '<p style="margin-top:14px"><button class="btn ghost" id="btn-add-student">＋ Add student</button></p></div>';

    // Assignments panel
    html += '<div class="panel hidden" id="p-assignments"><h2>📝 Assignments</h2>' +
      (assigns.length ? assigns.map(function (a) {
        return '<div style="padding:12px;border:1px solid rgba(255,255,255,.1);border-radius:10px;margin-bottom:8px"><b>' + esc(a.title || a.articleTitle || 'Assignment') + '</b><br><span style="color:var(--muted);font-size:13px">' + esc(a.status || 'active') + '</span></div>';
      }).join('') : '<p style="color:var(--muted)">No assignments yet.</p>') +
      '<p style="margin-top:14px"><a class="btn" href="/pages/assignments.html">Manage assignments →</a></p></div>';

    // Progress panel
    var sorted = students.slice().sort(function (a, b) { return (b.xp || 0) - (a.xp || 0); }).slice(0, 5);
    html += '<div class="panel hidden" id="p-progress"><h2>📊 Top readers</h2>' +
      (sorted.length ? '<table class="stu-table"><tr><th>#</th><th>Student</th><th>XP</th><th>Streak</th></tr>' +
        sorted.map(function (s, i) { return '<tr><td>' + (i + 1) + '</td><td>' + esc(s.name) + '</td><td>' + (s.xp || 0).toLocaleString() + '</td><td>' + (s.streak || 0) + '🔥</td></tr>'; }).join('') + '</table>'
        : '<p style="color:var(--muted)">No data yet.</p>') + '</div>';

    // Actions panel
    html += '<div class="panel hidden" id="p-actions"><h2>⚡ Quick actions</h2>' +
      '<p><a class="btn" href="/pages/assignments.html">📝 New assignment</a> <a class="btn ghost" href="/pages/classroom.html">💬 Start discussion</a></p></div>';

    body.innerHTML = html;
    body.querySelectorAll('[data-panel]').forEach(function (t) {
      t.addEventListener('click', function () {
        var id = t.getAttribute('data-panel');
        body.querySelectorAll('.panel').forEach(function (p) { p.classList.add('hidden'); });
        var el = document.getElementById(id);
        if (el) { el.classList.remove('hidden'); el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
      });
    });
  }

  function bindNewClass() {
    var b = document.getElementById('btn-new-class');
    if (b) b.addEventListener('click', function () {
      var name = prompt('Class name (e.g. "Ms. Rivera\'s 4th Grade"):');
      if (!name) return;
      api('/api/classrooms', { method: 'POST', body: JSON.stringify({ name: name }) })
        .then(function () { location.reload(); })
        .catch(function () { alert('Could not create class.'); });
    });
  }

  /* ============ BOOT ============ */
  function boot() {
    api('/api/auth/me').then(function (d) {
      var user = d.user;
      if (!user) { location.href = '/pages/login.html'; return; }
      var roles = user.roles || [user.role || 'parent'];
      user.roles = roles;
      var isTeacher = roles.indexOf('teacher') !== -1 || roles.indexOf('admin') !== -1;
      var isParent = roles.indexOf('parent') !== -1 || !isTeacher;

      // Multi-role: show switcher
      if (roles.indexOf('teacher') !== -1 && roles.indexOf('parent') !== -1) {
        showRoleSwitcher(user);
        return;
      }
      if (isTeacher) loadTeacher(user);
      else loadParent(user);
    }).catch(function () { location.href = '/pages/login.html'; });
  }

  function showRoleSwitcher(user) {
    root.innerHTML = '<div class="dash-head">' + avatarHtml(user.name || user.email, user.avatarColor, user.avatarEmoji) +
      '<div><h1>' + esc(user.name || 'Dashboard') + '</h1><p class="sub">Choose your view</p></div></div>' +
      '<div class="dash-roles"><button id="sw-parent" class="active">👨‍👩‍👧 Parent</button><button id="sw-teacher">🏫 Teacher</button></div>' +
      '<div id="role-body"></div>';
    var body = document.getElementById('role-body');
    var bp = document.getElementById('sw-parent'), bt = document.getElementById('sw-teacher');
    // Temporarily swap root for sub-renders
    var realRoot = root;
    function showParent() {
      bp.classList.add('active'); bt.classList.remove('active');
      root = body; loadParent(user); root = realRoot;
    }
    function showTeacher() {
      bt.classList.add('active'); bp.classList.remove('active');
      root = body; loadTeacher(user); root = realRoot;
    }
    bp.addEventListener('click', showParent);
    bt.addEventListener('click', showTeacher);
    showParent();
  }

  function loadParent(user) {
    Promise.all([
      api('/api/kids').catch(function () { return { kids: [] }; }),
      api('/api/gamification/status').catch(function () { return { kids: [] }; }),
    ]).then(function (rs) {
      var kids = rs[0].kids || rs[0] || [];
      var gam = {};
      (rs[1].kids || []).forEach(function (k) { gam[k.id] = k; });
      parentDash(user, kids, gam);
    });
  }

  function loadTeacher(user) {
    api('/api/classrooms').then(function (d) {
      teacherDash(user, d.classrooms || d || []);
    }).catch(function () {
      teacherDash(user, []);
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
