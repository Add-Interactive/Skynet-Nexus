<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Kid Creations Gallery — Skynet Nexus</title>
<link rel="stylesheet" href="/assets/css/style.css"/>
<style>
  body { background: #0B1026; color: #e6ecf3; font-family: Inter, sans-serif; margin: 0; }
  .g-wrap { max-width: 1000px; margin: 0 auto; padding: 24px 18px 80px; }
  .g-hero { text-align: center; padding: 30px 0; }
  .g-hero h1 { font-size: 2rem; margin: 0 0 8px; }
  .g-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
  .g-card { background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.1); border-radius: 16px; overflow: hidden; }
  .g-card img { width: 100%; height: 160px; object-fit: cover; background: rgba(0,229,255,.05); }
  .g-body { padding: 14px 16px; }
  .g-title { font-weight: 800; font-size: 15px; margin-bottom: 4px; }
  .g-desc { font-size: 13px; color: #9fb0c3; line-height: 1.5; margin-bottom: 8px; }
  .g-meta { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #7c8898; }
  .g-like { background: none; border: 1px solid rgba(255,255,255,.2); border-radius: 8px; color: #e6ecf3; padding: 6px 12px; cursor: pointer; font-size: 13px; }
  .g-like:hover { border-color: #ff2e63; }
</style>
</head>
<body>
<div class="g-wrap">
  <div class="g-hero">
    <div style="font-size:3rem">🎨</div>
    <h1>Kid Creations Gallery</h1>
    <p style="color:#9fb0c3">Builds, experiments, and art from young makers — every piece parent-approved.</p>
    <p><a href="/pages/kid.html" style="color:#00e5ff">Share yours from your dashboard →</a></p>
  </div>
  <div class="g-grid" id="g-grid"><p style="color:#7c8898">Loading…</p></div>
</div>
<script>
(function () {
  function esc(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
  fetch('/api/creations/gallery').then(function (r) { return r.json(); }).then(function (d) {
    var g = document.getElementById('g-grid');
    var items = d.gallery || [];
    if (!items.length) { g.innerHTML = '<p style="color:#7c8898">No creations yet — be the first!</p>'; return; }
    g.innerHTML = items.map(function (x) {
      return '<div class="g-card">' +
        (x.image_url ? '<img src="' + esc(x.image_url) + '" alt="" loading="lazy"/>' : '<div style="height:120px;display:flex;align-items:center;justify-content:center;font-size:3rem">🎨</div>') +
        '<div class="g-body"><div class="g-title">' + esc(x.title) + '</div>' +
        '<div class="g-desc">' + esc((x.description || '').slice(0, 120)) + '</div>' +
        '<div class="g-meta"><span>' + esc(x.kid_first || 'a maker') + '</span>' +
        '<button class="g-like" data-like="' + x.id + '">❤️ ' + (x.likes || 0) + '</button></div></div></div>';
    }).join('');
    g.querySelectorAll('[data-like]').forEach(function (b) {
      b.addEventListener('click', function () {
        fetch('/api/creations/' + b.getAttribute('data-like') + '/like', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: '{}' })
          .then(function () { location.reload(); })
          .catch(function () { alert('Sign in to like!'); });
      });
    });
  }).catch(function () { document.getElementById('g-grid').innerHTML = '<p style="color:#ff2e63">Could not load.</p>'; });
})();
</script>
</body>
</html>
