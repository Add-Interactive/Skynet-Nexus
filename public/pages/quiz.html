<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>TRIVIA ARENA // Skynet Nexus Holo-OS</title>
  <meta name="description" content="Rapid-Fire Boss Battle Trivia Arena for STEM Cadets. Earn XP, maintain your combo streak, and conquer the daily intelligence challenge."/>
  <link rel="icon" type="image/svg+xml" href="/assets/img/logo.svg"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Plus+Jakarta+Sans:wght@400;600;700;800;900&family=Lexend:wght@400;600;700&family=JetBrains+Mono:wght@500;700;800&display=swap"/>
  <link rel="stylesheet" href="/assets/css/game-ui.css?v=20261013-game3"/>
</head>
<body>

  <!-- Ambient Holographic Canvas -->
  <canvas id="space-canvas"></canvas>
  <div class="holo-grid-bg"></div>
  <div class="ambient-nebula nebula-1"></div>
  <div class="ambient-nebula nebula-2"></div>

  <!-- 1. TOP GAMER HUD BAR -->
  <header class="game-hud-bar">
    <a href="../index.html" class="game-brand" aria-label="Skynet Nexus Command">
      <div class="brand-hologram-icon">🧠</div>
      <div>
        <div class="brand-text-game">SKYNET NEXUS</div>
        <div class="brand-sub-game">HOLO-OS // TRIVIA BATTLE ARENA</div>
      </div>
    </a>

    <div class="game-hud-center">
      <a href="../index.html" class="tactical-btn tactical-btn-ghost" style="padding:6px 14px;font-size:0.75rem;">
        &larr; MISSION HUB
      </a>
      <a href="kid.html" class="tactical-btn tactical-btn-cyan" style="padding:6px 14px;font-size:0.75rem;">
        🚀 CADET SPACE
      </a>
      <a href="leaderboard.html" class="tactical-btn tactical-btn-purple" style="padding:6px 14px;font-size:0.75rem;">
        🏆 LEADERBOARD
      </a>
    </div>

    <div class="game-hud-stats">
      <div class="hud-stat-pill">
        <span>⭐ XP</span>
        <strong id="hud-xp-val" class="xp-glow">340 XP</strong>
      </div>
      <button type="button" class="sfx-toggle-pill" id="sfx-toggle" title="Toggle Synthesized Audio SFX">
        🔊 SFX ON
      </button>
      <a href="profile.html" class="cadet-badge-mini" title="Fleet Command Profile">
        <span class="cadet-avatar-face">👨‍🚀</span>
        <span class="cadet-level-tag">LVL 3</span>
      </a>
    </div>
  </header>

  <!-- 2. QUIZ ARENA MAIN -->
  <main class="quiz-arena-wrap">

    <div class="quiz-arena-frame" id="quiz-arena-frame">

      <!-- Quiz Arena HUD -->
      <div class="quiz-hud-row">
        <div class="quiz-lives-container" id="quiz-lives" title="Player Shields">
          ❤️❤️❤️
        </div>
        <div class="quiz-combo-pill" id="quiz-combo">
          🔥 COMBO: x1
        </div>
        <div class="quiz-round-tag" id="quiz-round-indicator">
          ROUND 1 / 5
        </div>
      </div>

      <!-- Boss Opponent Card -->
      <div class="quiz-boss-card">
        <div class="quiz-boss-avatar">👾</div>
        <div class="quiz-boss-info">
          <h3>SENTINEL AI &middot; SECTOR QUIZ MASTER</h3>
          <p>Analyzing cadet comprehension against today's STEM transmissions.</p>
        </div>
      </div>

      <!-- Question & Answers Container -->
      <div id="quiz-dynamic-content">
        <!-- Injected dynamically -->
      </div>

    </div>

  </main>

  <script src="/assets/js/game-engine.js?v=20261013-game3"></script>
  <script>
    (function () {
      'use strict';
      var questions = [];
      var currentIdx = 0;
      var lives = 3;
      var combo = 0;
      var totalCorrect = 0;
      var earnedXp = 0;

      var fallbackQuestions = [
        {
          q: 'Which spacecraft just deployed the largest solar array in deep space history to study an icy ocean moon?',
          answers: ['Europa Clipper', 'Voyager 1', 'James Webb Telescope', 'Curiosity Rover'],
          correct: 0,
          explanation: 'Europa Clipper features solar wings spanning over 100 feet to gather power near Jupiter.'
        },
        {
          q: 'What is the primary power technology enabling autonomous micro-submarines under cosmic ocean ice?',
          answers: ['Nuclear Radioisotope Thermoelectric', 'Atmospheric Wind Turbines', 'Photosynthesis Panels', 'Combustion Engines'],
          correct: 0,
          explanation: 'Radioisotope generators provide steady warmth and electrical power in total darkness beneath miles of ice.'
        },
        {
          q: 'How many daily news drops does the Skynet Nexus signal transmit for students and families?',
          answers: ['Three editions (Morning, Midday, Evening)', 'Once per month', 'Only on weekends', 'Ten editions per hour'],
          correct: 0,
          explanation: 'Skynet Nexus drops at 7:15 AM, 2:15 PM, and 6:15 PM ET.'
        },
        {
          q: 'Why does every Skynet Nexus story include a Kid Take written at an age 8 reading level?',
          answers: ['To let young learners and older siblings read side-by-side', 'Because adults cannot read', 'To replace textbooks entirely', 'It is an automated error'],
          correct: 0,
          explanation: 'Co-reading empowers families and multi-age classrooms to explore STEM together.'
        },
        {
          q: 'What happens when you complete a quiz round without losing any player shield hearts?',
          answers: ['You achieve S-Rank and maximum bounty XP payout', 'Your account resets', 'The quiz closes forever', 'Nothing happens'],
          correct: 0,
          explanation: 'Flawless streaks award S-Rank prestige and bonus XP boosts on the leaderboard.'
        }
      ];

      function updateHud() {
        var heartStr = '';
        for (var i = 0; i < 3; i++) {
          heartStr += (i < lives) ? '❤️' : '🖤';
        }
        document.getElementById('quiz-lives').innerHTML = heartStr;
        document.getElementById('quiz-combo').textContent = '🔥 COMBO: x' + (combo + 1);
        document.getElementById('quiz-round-indicator').textContent = 'ROUND ' + (currentIdx + 1) + ' / ' + questions.length;
      }

      function loadQuizData() {
        fetch('/api/quizzes/today')
          .then(function (r) { if (!r.ok) throw 0; return r.json(); })
          .then(function (data) {
            if (data && data.questions && data.questions.length) {
              questions = data.questions.map(function (q) {
                return {
                  q: q.question,
                  answers: q.options || q.choices || ['Option A', 'Option B', 'Option C', 'Option D'],
                  correct: q.correctIndex !== undefined ? q.correctIndex : 0,
                  explanation: q.explanation || ''
                };
              });
            } else {
              questions = fallbackQuestions;
            }
            renderQuestion();
          })
          .catch(function () {
            questions = fallbackQuestions;
            renderQuestion();
          });
      }

      function renderQuestion() {
        updateHud();
        var content = document.getElementById('quiz-dynamic-content');

        if (lives <= 0) {
          // Defeat screen
          if (window.GameEngine && window.GameEngine.playSfx) window.GameEngine.playSfx('wrong');
          content.innerHTML = 
            '<div style="text-align:center;padding:30px 10px;">' +
              '<div style="font-size:72px;margin-bottom:14px;">💥</div>' +
              '<h2 style="font-family:var(--font-game);color:var(--neon-rose);font-size:2rem;margin-bottom:10px;">SHIELDS DEPLETED // MISSION FAILED</h2>' +
              '<p style="color:#9cb5d6;font-size:1.1rem;margin-bottom:28px;">The Sentinel AI intercepted your answers. Recharge your shields and deploy again!</p>' +
              '<button type="button" class="holo-claim-btn" id="quiz-retry-btn" style="background:linear-gradient(135deg,var(--neon-rose),var(--neon-purple));color:#fff;">' +
                '🔄 RESTART COMBAT ROUND' +
              '</button>' +
            '</div>';
          document.getElementById('quiz-retry-btn').onclick = function () {
            lives = 3;
            combo = 0;
            currentIdx = 0;
            totalCorrect = 0;
            renderQuestion();
          };
          return;
        }

        if (currentIdx >= questions.length) {
          // Victory screen!
          if (window.GameEngine && window.GameEngine.playSfx) window.GameEngine.playSfx('success');
          var rank = (lives === 3) ? 'S-RANK // FLAWLESS' : (lives === 2) ? 'A-RANK // ACE' : 'B-RANK // SURVIVOR';
          earnedXp = (totalCorrect * 10) + (lives * 5);

          content.innerHTML = 
            '<div style="text-align:center;padding:30px 10px;">' +
              '<div style="font-size:76px;margin-bottom:14px;">🏆</div>' +
              '<div style="display:inline-block;padding:8px 20px;border-radius:999px;background:var(--neon-green);color:#040814;font-family:var(--font-game);font-size:0.9rem;font-weight:900;margin-bottom:16px;">' + rank + '</div>' +
              '<h2 style="font-family:var(--font-game);color:#fff;font-size:2.2rem;margin-bottom:10px;">ARENA CONQUERED!</h2>' +
              '<p style="color:#9cb5d6;font-size:1.15rem;margin-bottom:28px;">You decoded ' + totalCorrect + ' of ' + questions.length + ' STEM intelligence questions with ' + lives + ' shield(s) remaining.</p>' +
              '<div style="margin-bottom:30px;">' +
                '<span style="font-family:var(--font-game);font-size:1.6rem;color:var(--neon-amber);font-weight:900;">+' + earnedXp + ' XP BOUNTY</span>' +
              '</div>' +
              '<div style="display:flex;gap:14px;justify-content:center;flex-wrap:wrap;">' +
                '<button type="button" class="holo-claim-btn" id="claim-quiz-xp">' +
                  '⚡ CLAIM XP REWARD' +
                '</button>' +
                '<a href="kid.html" class="tactical-btn tactical-btn-purple" style="font-size:1rem;padding:16px 30px;">' +
                  '🚀 VIEW CADET VAULT' +
                '</a>' +
              '</div>' +
            '</div>';

          document.getElementById('claim-quiz-xp').onclick = function () {
            if (window.GameEngine && window.GameEngine.claimMissionXp) {
              window.GameEngine.player.xp += earnedXp;
              document.getElementById('hud-xp-val').textContent = window.GameEngine.player.xp + ' XP';
              if (window.GameEngine.playSfx) window.GameEngine.playSfx('success');
              alert('🎉 XP LOGGED! You now have ' + window.GameEngine.player.xp + ' total XP.');
              location.href = 'kid.html';
            }
          };
          return;
        }

        var cur = questions[currentIdx];
        var html = 
          '<div class="quiz-q-title">' + (currentIdx + 1) + '. ' + cur.q + '</div>' +
          '<div class="quiz-choices-stack">';

        cur.answers.forEach(function (ans, idx) {
          var letter = String.fromCharCode(65 + idx);
          html += 
            '<button type="button" class="quiz-choice-btn" data-idx="' + idx + '">' +
              '<span class="quiz-choice-key">' + letter + '</span>' +
              '<span>' + ans + '</span>' +
            '</button>';
        });

        html += '</div>';
        content.innerHTML = html;

        content.querySelectorAll('.quiz-choice-btn').forEach(function (btn) {
          btn.addEventListener('mouseenter', function () {
            if (window.GameEngine && window.GameEngine.playSfx) window.GameEngine.playSfx('hover');
          });

          btn.addEventListener('click', function () {
            var chosen = parseInt(this.getAttribute('data-idx'), 10);
            if (chosen === cur.correct) {
              if (window.GameEngine && window.GameEngine.playSfx) window.GameEngine.playSfx('success');
              this.classList.add('correct');
              combo++;
              totalCorrect++;
              setTimeout(function () {
                currentIdx++;
                renderQuestion();
              }, 700);
            } else {
              if (window.GameEngine && window.GameEngine.playSfx) window.GameEngine.playSfx('wrong');
              this.classList.add('wrong');
              lives--;
              combo = 0;
              // Highlight the correct answer
              var allBtns = content.querySelectorAll('.quiz-choice-btn');
              if (allBtns[cur.correct]) allBtns[cur.correct].classList.add('correct');
              setTimeout(function () {
                currentIdx++;
                renderQuestion();
              }, 1200);
            }
          });
        });
      }

      loadQuizData();

    })();
  </script>
</body>
</html>
